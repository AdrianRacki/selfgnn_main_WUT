# cSpell:disable
[project]
name = "selfgnn-main"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch-geometric>=2.6.1",
    "torch>=2.5.1",
    "numpy>=2.2.0",
    "ipykernel>=6.29.5",
    "rdkit>=2024.3.6",
    "pandas>=2.2.3",
    "matplotlib>=3.9.3",
    "scikit-learn>=1.6.0",
    "lightning>=2.4.0",
    "networkx>=3.4.2",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "tqdm>=4.67.1",
    "optuna>=4.2.1",
    "optuna-integration>=4.2.1",
    "ruff>=0.15.12",
    "litlogger>=2026.4.16",
    "mlflow>=3.12.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
extend-ignore = ["E203", "E722"]
