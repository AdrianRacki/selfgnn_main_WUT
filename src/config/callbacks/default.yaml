early_stopper:
  _target_: lightning.pytorch.callbacks.EarlyStopping
  monitor: val_MeanAbsoluteError
  min_delta: 0.01
  patience: 10
  verbose: False
  mode: min
  strict: True
  check_finite: True
lr_monitor:
  _target_: lightning.pytorch.callbacks.LearningRateMonitor
  logging_interval: step
  log_momentum: False
  log_weight_decay: False
model_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  monitor: val_PearsonCorrCoef
  mode: max
  save_top_k: 1
  dirpath: ./lightning_logs
  filename: best
parity_plotter:
  _target_: utils.parity_plot_callback.ParityPlotCallback


