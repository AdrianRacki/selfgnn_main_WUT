dataset:
  _target_: dataset.LabeledGraphDataset
  root: data
  raw_filename: idac.csv
  processed_filename: processed_idac.pt
  append_temperature_vector: true
  separate_global_features: true
  node_features:
    sizes: [120, 10, 20, 10, 10, 10, 3, 3]
    features:
    - atomic_num
    - chirality
    - degree
    - formal_charge
    - hybridization
    - num_hs
    - is_aromatic
    - is_in_ring
  edge_features:
    sizes: [20, 3, 3, 6]
    features:
    - bond_type
    - is_conjugated
    - is_in_ring
    - stereo
  global_features:
    features:
    - MolLogP
    - CalcKappa1
    - CalcKappa2
    - CalcKappa3
    - CalcLabuteASA
    - Chi0
    - Chi1
    - ExactMolWt
    - HeavyAtomMolWt
    - CalcFractionCSP3
    - CalcHallKierAlpha
    - PEOE_VSA9
    - SlogP_VSA1
    - EState_VSA2
    - MaxAbsEStateIndex

datamodule:
  _target_: datamodule.GNNDataModule
  batch_size: 256
  data_split: 0.9
  seed: 42
