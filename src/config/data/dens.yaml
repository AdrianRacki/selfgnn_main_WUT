dataset:
  _target_: dataset.LabeledGraphDataset
  root: /Users/adrianracki/Desktop/Projects/selfgnn_main/data
  raw_filename: raw_density.csv 
  processed_filename: processed_density.pt
  node_features:
    sizes: [120, 10, 20, 10, 10, 10, 3, 3]
    features:
    - atomic_num
    - chirality
    - degree
    - formal_charge
    - hybridization
    - num_hs
    - is_aromatic
    - is_in_ring
  edge_features:
    sizes: [20, 3, 3, 6]
    features:
    - bond_type
    - is_conjugated
    - is_in_ring
    - stereo
  global_features:
    features:
    - MolLogP
    - CalcKappa1
    - CalcKappa2
    - CalcKappa3
    - CalcLabuteASA 
    - Chi0
    - Chi1
    - ExactMolWt
    - HeavyAtomMolWt 
    - CalcFractionCSP3 
    - CalcHallKierAlpha
    - PEOE_VSA9
    - SlogP_VSA1
    - EState_VSA2
    - MaxAbsEStateIndex
    
datamodule:
  _target_: datamodule.GNNDataModule
  batch_size: 20
  data_split: 0.8
  seed: 42