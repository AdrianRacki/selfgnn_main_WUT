_target_: model.DoubleGraphPredictor
encoder:
  _target_: model.GATEncoder
  emb_size: 8
  hidden_dim: 32
  num_heads: 1
  node_size_of_dicts: ${data.dataset.node_features.sizes}
  edge_size_of_dicts: ${data.dataset.edge_features.sizes}
  out_dim: 32
  num_layers: 2
  global_pool: 
    _target_: torch_geometric.nn.aggr.SoftmaxAggregation
    t: 2
    learn: True
  projector:
    _target_: generic.MLP
    in_features: 1 # This is inferred inside the model
    out_features: 32 # This should be >1 in DoubleGraphPredictor
    num_layers: 4
    use_norm: True
projector:
  _target_: generic.MLP
  in_features: 1 # This is inferred inside the model
  out_features: 1
  num_layers: 4
  use_norm: True

