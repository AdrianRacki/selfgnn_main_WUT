# THIS IS BASELINE MODEL CONFIGURATION
_target_: model.base.BaseModel
embedding_layer:
  _target_: model.embedding.GraphEmbeddingLayer
  node_feature_sizes: ${data.dataset.node_features.sizes}
  edge_feature_sizes: ${data.dataset.edge_features.sizes}
  global_features_module:
    _target_: torch.nn.Linear
    in_features: 15
    out_features: 15
  emb_size: 4
  global_features_size: 15
encoder_layer:
  _target_: model.gated_encoder.GatedEncoder
  _partial_: true
  hidden_dim: 64
  num_layers: 2
  n_experts: 4
  encoder_type: "GIN"
  shared_expert: true
  internal_model: "CrossNetV2"
  cross_layers: 2
pooling_layer:
  _target_: model.pooling.IDACTransformerPooling
  num_mols: 3
  pooling_layer:
    _target_: torch_geometric.nn.aggr.MLPAggregation
    _partial_: true
    in_channels: 64
    out_channels: 64
    max_num_elements: 25
    num_layers: 1
projector_layer:
  _target_: model.idac_layers.IDACTransformerProjector
  _partial_: true
  num_mols: 3
  d_model: 64
  nhead: 2
  num_transformer_layers: 2
  dim_feedforward: 64
  dropout_rate: 0.25
  out_features: 1
  append_global_features: false
  global_features_size: 45  # num_mols * num_global_features
