optimizer:
  _target_: torch.optim.AdamW
  lr: 0.01
  weight_decay: 0.005
warmup_epochs: 2
scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
  T_0: 10
  T_mult: 4
  eta_min: 1e-5
loss:
  _target_: torch.nn.HuberLoss
  delta: 0.17

model_k_params: 1 # number of parameters in the model in thousands

trainer:
  _target_: lightning.pytorch.Trainer
  min_epochs: 10
  max_epochs: 60
  accelerator: cpu
  log_every_n_steps: 400
  logger:
    _target_: lightning.pytorch.loggers.MLFlowLogger
    experiment_name: selfgnn
    run_name: ${run_name}
    tracking_uri: http://127.0.0.1:5001
    # mlflow server --host 127.0.0.1 --port 5001
